<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Little Surprise 🎀</title>


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <link rel="stylesheet" href="page3.css">

</head>


<body>


    <div class="birthday-background">


        <!-- Background glows -->

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>


        <!-- Balloons -->

        <div class="balloon balloon-one">
            🎈
        </div>

        <div class="balloon balloon-two">
            🎈
        </div>

        <div class="balloon balloon-three">
            🎈
        </div>

        <div class="balloon balloon-four">
            🎈
        </div>


        <!-- Sparkles -->

        <div class="sparkle sparkle-one">✦</div>
        <div class="sparkle sparkle-two">✧</div>
        <div class="sparkle sparkle-three">✦</div>
        <div class="sparkle sparkle-four">✧</div>


        <!-- Confetti -->

        <div class="confetti confetti-one">•</div>
        <div class="confetti confetti-two">✦</div>
        <div class="confetti confetti-three">•</div>
        <div class="confetti confetti-four">✧</div>
        <div class="confetti confetti-five">•</div>


        <!-- Main content -->

        <main class="surprise-container">


            <div class="little-heading">
                ✨ A LITTLE INTERRUPTION ✨
            </div>


            <!-- Main rounded rectangle -->

            <section class="message-card">


                <div class="card-decoration top">
                    ♡
                </div>


                <div class="card-decoration left">
                    ✦
                </div>


                <div class="card-decoration right">
                    ✦
                </div>


                <div class="card-decoration bottom">
                    ♡
                </div>


                <div class="message-content">


                    <div class="cute-icon">
                        📖
                    </div>


                    <p class="message">

                        Well... there was no story,

                        <br>

                        but <span>BUT BUT BUT...</span>

                        <br>

                        I have a surprise for you! 🎁

                    </p>


                    <div class="tiny-divider">
                        <span></span>
                        ✦
                        <span></span>
                    </div>


                    <p class="continue-question">
                        Shall we continue?
                    </p>


                    <!-- YES / NO -->

                    <div class="choice-buttons">


                        <button
                            id="yesButton"
                            class="yes-button"
                        >
                            YESSS ✨
                        </button>


                        <button
                            id="noButton"
                            class="no-button"
                        >
                            No 🙈
                        </button>


                    </div>


                    <p class="tiny-hint">
                        your answer may have consequences... 👀
                    </p>


                </div>


            </section>


        </main>


        <!-- Funny popup -->

        <div
            class="funny-overlay hidden"
            id="funnyOverlay"
        >


            <div class="funny-popup">


                <div
                    class="funny-emoji"
                    id="funnyEmoji"
                >
                    😭
                </div>


                <h2 id="funnyTitle">
                    WAIT A MINUTE!
                </h2>


                <p id="funnyMessage">
                    You can't abandon the surprise
                    now! 😂
                </p>


                <button id="goBackButton">
                    Okay, I'll go back 😌
                </button>


            </div>


        </div>


    </div>


    <script src="page3.js"></script>

</body>

</html>
