<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two Little Surprises 🎁</title>

    <!-- Baloo 2 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./page5.css">
</head>

<body>

<div class="party-room">

    <!-- =================================
         BACKGROUND
    ================================== -->

    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>

    <div class="fairy-lights">

        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>

    </div>


    <!-- Balloons -->

    <div class="balloon balloon-one">🎈</div>
    <div class="balloon balloon-two">🎈</div>
    <div class="balloon balloon-three">🎈</div>
    <div class="balloon balloon-four">🎈</div>


    <!-- Floating stars -->

    <div class="star star-one">✦</div>
    <div class="star star-two">✧</div>
    <div class="star star-three">✦</div>
    <div class="star star-four">✧</div>
    <div class="star star-five">✦</div>


    <!-- =================================
         GIFT BOXES
    ================================== -->

    <div class="gift gift-one">
        🎁
    </div>

    <div class="gift gift-two">
        🎀
    </div>

    <div class="gift gift-three">
        🎁
    </div>


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <main class="surprise-container">

        <div class="little-label">
            ✨ A LITTLE SOMETHING ✨
        </div>


        <section class="surprise-card">

            <div class="card-sparkle sparkle-one">
                ✦
            </div>

            <div class="card-sparkle sparkle-two">
                ✧
            </div>

            <div class="card-sparkle sparkle-three">
                ✦
            </div>


            <!-- Question -->

            <div
                class="question-content"
                id="questionContent"
            >

                <div class="main-icon">
                    🎀
                </div>

                <h1>
                    Do you want<br>
                    <span>some more?</span>
                </h1>

                <div class="tiny-divider">
                    <span></span>
                    ✦
                    <span></span>
                </div>

                <p class="question-text">
                    I might have a surprise... 👀
                </p>

                <div class="buttons">

                    <button
                        id="yesButton"
                        class="yes-button"
                    >
                        YESSS ✨
                    </button>

                    <button
                        id="noButton"
                        class="no-button"
                    >
                        NO 🙈
                    </button>

                </div>

            </div>


            <!-- =================================
                 YES MESSAGE
            ================================== -->

            <div
                class="surprise-message hidden"
                id="surpriseMessage"
            >

                <div class="big-gift">
                    🎁
                </div>

                <p class="little-text">
                    WAIT... 👀
                </p>

                <h2>
                    But I have
                    <span>2 surprises</span>
                    🥺
                </h2>

                <div class="tiny-divider">
                    <span></span>
                    💗
                    <span></span>
                </div>

                <p class="message-text">
                    And you haven't even seen
                    them yet...
                </p>

                <button
                    id="checkOutButton"
                    class="check-button"
                >
                    CHECK OUT ✨
                </button>

            </div>

        </section>

    </main>


    <!-- =================================
         FUNNY NO POPUP
    ================================== -->

    <div
        class="funny-overlay hidden"
        id="funnyOverlay"
    >

        <div class="funny-popup">

            <div
                class="funny-emoji"
                id="funnyEmoji"
            >
                😭
            </div>

            <h2 id="funnyTitle">
                EXCUSE ME?!
            </h2>

            <p id="funnyMessage">
                You can't leave now! 😂
            </p>

            <button id="goBackButton">
                Okay okay, go back 😌
            </button>

        </div>

    </div>

</div>


<script src="./page5.js"></script>

</body>
</html>
