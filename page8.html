<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Princess 🎂</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="page8.css">
</head>

<body>

<div class="birthday-page">

    <!-- =================================
         BLACK INTRO
    ================================== -->

    <div class="dark-intro" id="darkIntro">

        <div class="intro-cake">

            <div class="cake-candle">
                <div class="flame"></div>
            </div>

            <div class="cake-candle">
                <div class="flame"></div>
            </div>

            <div class="cake-candle">
                <div class="flame"></div>
            </div>

            <div class="cake-top"></div>

            <div class="cake-body">

                <div class="cake-cream cream-one"></div>
                <div class="cake-cream cream-two"></div>
                <div class="cake-cream cream-three"></div>

                <div class="cake-decoration">♡</div>
                <div class="cake-decoration two">✦</div>

            </div>

            <div class="cake-plate"></div>

        </div>

    </div>


    <!-- =================================
         BEAUTIFUL ROOM
    ================================== -->

    <main class="celebration" id="celebration">

        <!-- Background decorations -->

        <div class="background-sparkle sparkle-one">✦</div>
        <div class="background-sparkle sparkle-two">✧</div>
        <div class="background-sparkle sparkle-three">♡</div>
        <div class="background-sparkle sparkle-four">✦</div>
        <div class="background-sparkle sparkle-five">✧</div>

        <!-- Books -->

        <div class="book-stack left-books">

            <div class="book book-one"></div>
            <div class="book book-two"></div>
            <div class="book book-three"></div>

        </div>


        <div class="book-stack right-books">

            <div class="book book-four"></div>
            <div class="book book-five"></div>
            <div class="book book-six"></div>

        </div>


        <!-- Candy decorations -->

        <div class="candy candy-one">🍭</div>
        <div class="candy candy-two">🍬</div>
        <div class="candy candy-three">🍭</div>
        <div class="candy candy-four">🍬</div>


        <!-- Balloons -->

        <div class="balloon balloon-one">🎈</div>
        <div class="balloon balloon-two">🎈</div>
        <div class="balloon balloon-three">🎈</div>


        <!-- =================================
             BANNER
        ================================== -->

        <div class="birthday-banner">

            <div class="banner-string"></div>

            <div class="banner-card">
                HAPPY BIRTHDAY
            </div>

            <div class="banner-card princess">
                PRINCESS 👑
            </div>

        </div>


        <!-- =================================
             MAIN CAKE
        ================================== -->

        <section class="cake-section">

            <div class="cake-glow"></div>

            <div
                class="main-cake"
                id="mainCake"
            >

                <!-- Candles -->

                <button
                    class="candle candle-one"
                    data-candle="1"
                    aria-label="Candle one"
                >
                    <span class="candle-flame"></span>
                </button>

                <button
                    class="candle candle-two"
                    data-candle="2"
                    aria-label="Candle two"
                >
                    <span class="candle-flame"></span>
                </button>

                <button
                    class="candle candle-three"
                    data-candle="3"
                    aria-label="Candle three"
                >
                    <span class="candle-flame"></span>
                </button>


                <!-- Cake -->

                <div class="cake-frosting">

                    <div class="frosting-drip"></div>
                    <div class="frosting-drip two"></div>
                    <div class="frosting-drip three"></div>

                    <span>♡</span>
                    <span>✦</span>
                    <span>♡</span>

                </div>

                <div class="cake-layer middle-layer">

                    <div class="cake-dot"></div>
                    <div class="cake-dot two"></div>
                    <div class="cake-dot three"></div>

                </div>

                <div class="cake-layer bottom-layer">

                    <div class="cake-ribbon"></div>

                </div>

                <div class="cake-base"></div>

            </div>

        </section>


        <!-- =================================
             WISH MESSAGE
        ================================== -->

        <div
            class="wish-message hidden"
            id="wishMessage"
        >

            <div class="wish-sparkle">
                ✨
            </div>

            <p>
                Make a wish Darling 💗
            </p>

            <small>
                then blow out the candles...
            </small>

        </div>


        <!-- =================================
             AFTER CANDLES
        ================================== -->

        <div
            class="after-wish hidden"
            id="afterWish"
        >

            <div class="after-emoji">
                🎉
            </div>

            <h2>
                YOUR WISH IS ON ITS WAY ✨
            </h2>

            <p>
                Happy Birthday, Princess! 💗
            </p>

        </div>


        <!-- =================================
             CONFETTI
        ================================== -->

        <div
            class="confetti-container"
            id="confettiContainer"
        ></div>


        <!-- =================================
             VOICE
        ================================== -->

        <audio
            id="birthdayVoice"
            src="birthday-voice.mp4"
            preload="auto"
        ></audio>

    </main>

</div>


<script src="page8.js"></script>

</body>
</html>
