<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Little Birthday Story 🎂</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="page2.css">

</head>


<body>


    <!-- Floating decorations -->

    <div class="birthday-background">

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>


        <div class="balloon balloon-one">
            🎈
        </div>

        <div class="balloon balloon-two">
            🎈
        </div>

        <div class="balloon balloon-three">
            🎈
        </div>


        <div class="sparkle sparkle-one">
            ✦
        </div>

        <div class="sparkle sparkle-two">
            ✧
        </div>

        <div class="sparkle sparkle-three">
            ✦
        </div>

        <div class="sparkle sparkle-four">
            ✧
        </div>


        <!-- Small birthday stars -->

        <div class="tiny-star ts-one">✦</div>
        <div class="tiny-star ts-two">✧</div>
        <div class="tiny-star ts-three">✦</div>
        <div class="tiny-star ts-four">✧</div>
        <div class="tiny-star ts-five">✦</div>


        <!-- Main content -->

        <main class="book-scene">


            <p class="little-intro">
                A tiny birthday adventure awaits...
            </p>


            <!-- BOOK -->

            <div class="book">


                <!-- Book spine -->

                <div class="book-spine"></div>


                <!-- Decorative ribbon -->

                <div class="bookmark-ribbon"></div>


                <!-- Book cover -->

                <div class="book-cover">


                    <div class="cover-decoration top-decoration">
                        ✦
                    </div>


                    <div class="cover-decoration left-decoration">
                        ❀
                    </div>


                    <div class="cover-decoration right-decoration">
                        ❀
                    </div>


                    <div class="cover-decoration bottom-decoration">
                        ✦
                    </div>


                    <div class="cover-inner">


                        <div class="mini-crown">
                            ♡
                        </div>


                        <p class="story-label">
                            A LITTLE
                        </p>


                        <h1>
                            Birthday
                            <br>
                            Story
                        </h1>


                        <div class="cover-line">
                            <span></span>
                            ✦
                            <span></span>
                        </div>


                        <p class="question">
                            Do you want
                            <br>
                            to read the story?
                        </p>


                        <div class="buttons">


                            <button
                                class="choice yes-choice"
                                id="yesButton"
                            >
                                Yes ✨
                            </button>


                            <button
                                class="choice no-choice"
                                id="noButton"
                            >
                                No 🙈
                            </button>


                        </div>


                        <p class="tiny-note">
                            choose wisely...
                        </p>


                    </div>

                </div>

            </div>


        </main>


        <!-- Funny NO popup -->

        <div
            class="funny-overlay hidden"
            id="funnyOverlay"
        >

            <div class="funny-popup">


                <div class="funny-emoji" id="funnyEmoji">
                    😭
                </div>


                <h2 id="funnyTitle">
                    EXCUSE ME?!
                </h2>


                <p id="funnyMessage">
                    You can't just say no
                    to your own birthday story! 😂
                </p>


                <button id="goBackButton">
                    Okay okay, go back 😌
                </button>


            </div>

        </div>


    </div>


    <script src="page2.js"></script>

</body>

</html>
