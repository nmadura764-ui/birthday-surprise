<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something Special ✨</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="night-sky">

        <div class="stars"></div>

        <div class="star star-1"></div>
        <div class="star star-2"></div>
        <div class="star star-3"></div>
        <div class="star star-4"></div>
        <div class="star star-5"></div>
        <div class="star star-6"></div>
        <div class="star star-7"></div>

        <div class="moon">
            <div class="moon-shadow"></div>
        </div>

        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>

        <main class="countdown-screen">

            <p class="top-message">
                Something special is waiting...
            </p>

            <h1>
                Are you ready?
            </h1>

            <p class="waiting-text">
                Your little surprise is waiting for you... ✨
            </p>

            <button
                id="skipButton"
                class="skip-button"
                onclick="window.location.href='page2.html'">
                ENTER ✨
            </button>

        </main>

    </div>

    <script>
        window.addEventListener("load", function () {
            document.body.classList.add("page-loaded");
        });
    </script>

</body>
</html>
